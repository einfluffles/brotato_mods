  <g fill="#fff" opacity="0.35">
    <circle cx="200" cy="300" r="3"/><circle cx="840" cy="330" r="2.5"/><circle cx="330" cy="760" r="2"/>
    <circle cx="700" cy="780" r="2"/><circle cx="420" cy="60" r="2.5"/><circle cx="610" cy="990" r="3"/>
  </g>

  <!-- title -->
  <g font-family="Tomson Talks" font-weight="bold" text-anchor="middle"
     paint-order="stroke" stroke="#2a1a10" stroke-linejoin="round">
    <text x="512" y="455" font-size="190" fill="#ffd84a" stroke-width="26">brotato</text>
    <text x="512" y="600" font-size="140" fill="#fff" stroke-width="24">:together</text>
  </g>

  <!-- tagline -->
  <rect x="262" y="690" width="500" height="80" rx="40" fill="#2a1a10" opacity="0.85" stroke="#ffd84a" stroke-width="5"/>
  <text x="512" y="745" font-family="Tomson Talks" font-size="54" letter-spacing="3" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="1.5">ONLINE CO-OP</text>
