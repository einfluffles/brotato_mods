<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Workshop preview for brotato:together: title + green materials. Original artwork; tools/package.sh renders it. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#5a3d6e"/>
      <stop offset="0.6" stop-color="#2e1f3d"/>
      <stop offset="1" stop-color="#160e1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd84a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <symbol id="gem" viewBox="-10 -14 20 28" overflow="visible">
      <path d="M 0,-14 L 10,0 L 0,14 L -10,0 Z" fill="#6ee07a" stroke="#1f5a2a" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M 0,-14 L 10,0 L 0,0 Z" fill="#b8ffbf" opacity="0.75"/>
      <path d="M 0,14 L -10,0 L 0,0 Z" fill="#2f9a40" opacity="0.6"/>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <ellipse cx="512" cy="470" rx="470" ry="260" fill="url(#glow)"/>

  <!-- green materials -->
