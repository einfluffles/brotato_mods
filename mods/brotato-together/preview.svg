<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Workshop preview for brotato:together. Original artwork; render with tools/render-preview.sh. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="70%">
      <stop offset="0" stop-color="#5a3d6e"/>
      <stop offset="0.6" stop-color="#2e1f3d"/>
      <stop offset="1" stop-color="#160e1f"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c2" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd84a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd84a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ground" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7a5a86" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a5a86" stop-opacity="0"/>
    </radialGradient>

    <!-- One potato, centred on its body, facing right (towards the partner). -->
    <g id="potato-body">
      <!-- feet -->
      <ellipse cx="-48" cy="150" rx="34" ry="18" fill="#3a2416"/>
      <ellipse cx="46" cy="152" rx="34" ry="18" fill="#3a2416"/>
      <!-- free arm, waving down and out -->
      <path d="M -98,20 Q -150,50 -168,110" fill="none" stroke="#3a2416" stroke-width="30" stroke-linecap="round"/>
      <path d="M -98,20 Q -150,50 -168,110" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
      <!-- high-five arm -->
      <path d="M 92,-10 Q 168,-80 176,-208" fill="none" stroke="#3a2416" stroke-width="30" stroke-linecap="round"/>
      <path d="M 92,-10 Q 168,-80 176,-208" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round"/>
      <!-- body -->
      <path d="M -6,-148 C 74,-152 122,-92 118,-12 C 115,62 100,134 18,148 C -62,160 -118,102 -121,20 C -125,-70 -88,-144 -6,-148 Z"
            fill="currentColor" stroke="#3a2416" stroke-width="10" stroke-linejoin="round"/>
      <!-- shading + spots -->
      <path d="M 70,-110 C 112,-60 112,40 84,104 C 70,130 40,142 18,146 C 92,118 108,20 70,-110 Z" fill="#000" opacity="0.10"/>
      <ellipse cx="-70" cy="58" rx="12" ry="8" fill="#000" opacity="0.13"/>
      <ellipse cx="-30" cy="104" rx="9" ry="6" fill="#000" opacity="0.13"/>
      <ellipse cx="62" cy="-104" rx="8" ry="6" fill="#000" opacity="0.13"/>
      <ellipse cx="-84" cy="-60" rx="7" ry="5" fill="#000" opacity="0.13"/>
      <!-- face -->
      <ellipse cx="-22" cy="-38" rx="22" ry="29" fill="#fff" stroke="#3a2416" stroke-width="5"/>
      <ellipse cx="38" cy="-38" rx="22" ry="29" fill="#fff" stroke="#3a2416" stroke-width="5"/>
      <circle cx="-12" cy="-44" r="11" fill="#1d120b"/>
      <circle cx="48" cy="-44" r="11" fill="#1d120b"/>
      <circle cx="-8" cy="-48" r="4" fill="#fff"/>
      <circle cx="52" cy="-48" r="4" fill="#fff"/>
      <ellipse cx="-50" cy="8" rx="17" ry="10" fill="#ff7b7b" opacity="0.45"/>
      <ellipse cx="72" cy="8" rx="15" ry="10" fill="#ff7b7b" opacity="0.45"/>
      <path d="M -14,10 Q 14,52 50,10 Z" fill="#5a1f1f" stroke="#3a2416" stroke-width="6" stroke-linejoin="round"/>
      <path d="M 0,26 Q 16,40 34,26" fill="#ff8f8f"/>
      <!-- high-five hand -->
      <circle cx="178" cy="-224" r="26" fill="currentColor" stroke="#3a2416" stroke-width="8"/>
      <circle cx="-170" cy="122" r="20" fill="currentColor" stroke="#3a2416" stroke-width="8"/>
    </g>

    <symbol id="gem" viewBox="-10 -14 20 28" overflow="visible">
      <path d="M 0,-14 L 10,0 L 0,14 L -10,0 Z" fill="#6ee07a" stroke="#1f5a2a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 0,-14 L 10,0 L 0,0 Z" fill="#b8ffbf" opacity="0.7"/>
    </symbol>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- floating materials -->
  <g opacity="0.85">
    <use xlink:href="#gem" x="110" y="420" width="20" height="28" transform="rotate(-15 120 434)"/>
    <use xlink:href="#gem" x="880" y="460" width="24" height="34" transform="rotate(12 892 477)"/>
    <use xlink:href="#gem" x="160" y="760" width="18" height="25"/>
    <use xlink:href="#gem" x="860" y="740" width="20" height="28" transform="rotate(-10 870 754)"/>
    <use xlink:href="#gem" x="70" y="600" width="14" height="20" opacity="0.6"/>
    <use xlink:href="#gem" x="940" y="610" width="14" height="20" opacity="0.6"/>
  </g>
  <g fill="#fff" opacity="0.35">
    <circle cx="90" cy="320" r="3"/><circle cx="950" cy="330" r="2.5"/><circle cx="200" cy="560" r="2"/>
    <circle cx="820" cy="590" r="2"/><circle cx="60" cy="880" r="2.5"/><circle cx="970" cy="860" r="3"/>
  </g>

  <!-- ground -->
  <ellipse cx="512" cy="840" rx="430" ry="90" fill="url(#ground)"/>
  <ellipse cx="330" cy="822" rx="120" ry="20" fill="#000" opacity="0.35"/>
  <ellipse cx="694" cy="822" rx="120" ry="20" fill="#000" opacity="0.35"/>

  <!-- connection: dotted link + signal arcs behind the high five -->
  <circle cx="512" cy="436" r="130" fill="url(#glow)"/>
  <g fill="none" stroke="#ffd84a" stroke-linecap="round" opacity="0.8">
    <path d="M 452,372 A 85,85 0 0 1 572,372" stroke-width="9"/>
    <path d="M 420,340 A 130,130 0 0 1 604,340" stroke-width="9" opacity="0.65"/>
    <path d="M 388,308 A 175,175 0 0 1 636,308" stroke-width="9" opacity="0.4"/>
  </g>

  <!-- the two potatoes -->
  <g transform="translate(330 660)">
    <use xlink:href="#potato-body" color="#e2aa6c"/>
    <!-- red headband -->
    <path d="M -114,-92 C -60,-128 40,-134 104,-96 L 112,-70 C 40,-108 -60,-102 -120,-66 Z" fill="#e0453a" stroke="#3a2416" stroke-width="6" stroke-linejoin="round"/>
    <path d="M -116,-80 C -150,-96 -168,-80 -172,-60 M -118,-74 C -150,-66 -160,-44 -150,-28" fill="none" stroke="#e0453a" stroke-width="12" stroke-linecap="round"/>
  </g>
  <g transform="translate(694 660) scale(-1 1)">
    <use xlink:href="#potato-body" color="#d4985a"/>
    <!-- sprout -->
    <path d="M -8,-146 C -10,-170 -4,-186 6,-196" fill="none" stroke="#3a2416" stroke-width="12" stroke-linecap="round"/>
    <path d="M -8,-146 C -10,-170 -4,-186 6,-196" fill="none" stroke="#4caf50" stroke-width="5" stroke-linecap="round"/>
    <path d="M 6,-196 C 30,-226 66,-210 60,-188 C 40,-180 20,-182 6,-196 Z" fill="#6ee07a" stroke="#3a2416" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 4,-192 C -18,-222 -52,-212 -48,-190 C -30,-180 -12,-182 4,-192 Z" fill="#4cc65a" stroke="#3a2416" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- spark where the hands meet -->
  <g transform="translate(512 436)">
    <path d="M 0,-62 L 14,-16 L 58,-22 L 22,8 L 40,52 L 0,26 L -40,52 L -22,8 L -58,-22 L -14,-16 Z"
          fill="#fff3a6" stroke="#ffb020" stroke-width="5" stroke-linejoin="round" opacity="0.9" transform="scale(0.9)"/>
  </g>
  <!-- hands drawn again on top of the spark so the high five reads -->
  <g stroke="#3a2416" stroke-width="8">
    <circle cx="497" cy="438" r="26" fill="#e2aa6c"/>
    <circle cx="527" cy="434" r="26" fill="#d4985a"/>
  </g>

  <!-- title -->
  <g font-family="Tomson Talks" font-weight="bold" text-anchor="middle"
     paint-order="stroke" stroke="#2a1a10" stroke-linejoin="round">
    <text x="512" y="150" font-size="150" fill="#ffd84a" stroke-width="22">brotato</text>
    <text x="512" y="272" font-size="112" fill="#fff" stroke-width="20">:together</text>
  </g>

  <!-- tagline -->
  <rect x="262" y="900" width="500" height="80" rx="40" fill="#2a1a10" opacity="0.85" stroke="#ffd84a" stroke-width="5"/>
  <text x="512" y="955" font-family="Tomson Talks" font-size="54" letter-spacing="3" text-anchor="middle" fill="#fff" stroke="#fff" stroke-width="1.5">ONLINE CO-OP</text>
</svg>
