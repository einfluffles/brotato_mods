    <use xlink:href="#gem" x="285.7" y="85.0" width="28.6" height="40" transform="rotate(15 300 105)" opacity="0.8"/>
    <use xlink:href="#gem" x="501.4" y="124.0" width="37.1" height="52" transform="rotate(-8 520 150)" opacity="1"/>
    <use xlink:href="#gem" x="744.3" y="93.0" width="31.4" height="44" transform="rotate(20 760 115)" opacity="0.85"/>
    <use xlink:href="#gem" x="877.9" y="194.0" width="44.3" height="62" transform="rotate(10 900 225)" opacity="1"/>
    <use xlink:href="#gem" x="72.1" y="312.0" width="25.7" height="36" transform="rotate(0 85 330)" opacity="0.7"/>
    <use xlink:href="#gem" x="933.6" y="344.0" width="22.9" height="32" transform="rotate(-15 945 360)" opacity="0.7"/>
    <use xlink:href="#gem" x="380.0" y="231.0" width="20.0" height="28" transform="rotate(30 390 245)" opacity="0.6"/>
    <use xlink:href="#gem" x="639.3" y="230.0" width="21.4" height="30" transform="rotate(-20 650 245)" opacity="0.6"/>
    <use xlink:href="#gem" x="61.4" y="504.0" width="37.1" height="52" transform="rotate(-15 80 530)" opacity="1"/>
    <use xlink:href="#gem" x="933.6" y="497.0" width="32.9" height="46" transform="rotate(18 950 520)" opacity="1"/>
    <use xlink:href="#gem" x="129.3" y="676.0" width="41.4" height="58" transform="rotate(12 150 705)" opacity="1"/>
    <use xlink:href="#gem" x="857.9" y="684.0" width="44.3" height="62" transform="rotate(-12 880 715)" opacity="1"/>
    <use xlink:href="#gem" x="248.6" y="857.0" width="32.9" height="46" transform="rotate(-25 265 880)" opacity="0.9"/>
    <use xlink:href="#gem" x="457.1" y="857.0" width="25.7" height="36" transform="rotate(10 470 875)" opacity="0.75"/>
    <use xlink:href="#gem" x="621.4" y="874.0" width="37.1" height="52" transform="rotate(20 640 900)" opacity="1"/>
    <use xlink:href="#gem" x="810.7" y="865.0" width="28.6" height="40" transform="rotate(-5 825 885)" opacity="0.85"/>
    <use xlink:href="#gem" x="49.3" y="945.0" width="21.4" height="30" transform="rotate(0 60 960)" opacity="0.6"/>
    <use xlink:href="#gem" x="963.6" y="939.0" width="22.9" height="32" transform="rotate(15 975 955)" opacity="0.6"/>
    <use xlink:href="#gem" x="964.3" y="60.0" width="21.4" height="30" transform="rotate(-10 975 75)" opacity="0.6"/>
    <use xlink:href="#gem" x="40.0" y="46.0" width="20.0" height="28" transform="rotate(8 50 60)" opacity="0.6"/>
    <use xlink:href="#gem" x="205.7" y="587.0" width="18.6" height="26" transform="rotate(25 215 600)" opacity="0.55"/>
    <use xlink:href="#gem" x="805.7" y="612.0" width="18.6" height="26" transform="rotate(-25 815 625)" opacity="0.55"/>
