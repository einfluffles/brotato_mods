# Release: a pushed tag <mod>/<YYYY-MM-DD-HHMM> on a commit of the default branch that has the
# commit status local-check = success (tools/local-check.sh) and whose changelog's newest section is
# that time becomes a GitHub Release with <Name>.zip, <Name>.zip.sha256 and changenote.txt (the
# section as Steam BBCode). tools/release.sh uploads it to the Workshop from the maintainer's PC.
name: Release

on:
  push:
    tags:
      - "brotato-together/*"
      - "brotato-trade/*"

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      statuses: read
    outputs:
      mod: ${{ steps.tag.outputs.mod }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        id: tag
        env:
          BASE: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mod="${GITHUB_REF_NAME%%/*}" stamp="${GITHUB_REF_NAME#*/}"
          [ -f "mods/$mod/workshop.json" ] || { echo "::error::no mods/$mod/workshop.json"; exit 1; }
          sha="$(git rev-parse "$GITHUB_REF^{commit}")"
          git merge-base --is-ancestor "$sha" "origin/$BASE" \
            || { echo "::error::$sha is not on $BASE: tag a commit of $BASE"; exit 1; }
          python3 tools/changelog.py check "mods/$mod/CHANGELOG.md" "$stamp" \
            || { echo "::error::mods/$mod/CHANGELOG.md does not match the tag (see above)"; exit 1; }
          status="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
            --jq '.statuses[] | select(.context == "local-check") | .state + " " + (.description // "")')"
          state="${status%% *}" description="${status#* }"
          if [ "$state" != success ]; then
            echo "::error::$sha has no commit status local-check = success (got: '${status:-none}'). Run tools/local-check.sh mods/$mod on it, then re-run this workflow."
            exit 1
          fi
          case " $description " in
            *" mods/$mod "*) ;;
            *) echo "::error::local-check on $sha did not cover mods/$mod ($description)"; exit 1 ;;
          esac
          echo "mod=$mod" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  publish:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Create the GitHub Release
        env:
          MOD: ${{ needs.verify.outputs.mod }}
          GH_TOKEN: ${{ github.token }}
        run: |
          changelog="mods/$MOD/CHANGELOG.md"
          zip="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["zip"])' "mods/$MOD/workshop.json")"
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          [ -f "dist/${zip%.zip}/$zip" ] || { echo "::error::no dist/${zip%.zip}/$zip: the zip in mods/$MOD/workshop.json does not match the manifest's name"; exit 1; }
          cp "dist/${zip%.zip}/$zip" "$out/"
          (cd "$out" && sha256sum "$zip" > "$zip.sha256")
          python3 tools/changelog.py notes "$changelog" --bbcode > "$out/changenote.txt"
          {
            python3 tools/changelog.py notes "$changelog"
            echo
            echo "SHA256 \`$(cut -d' ' -f1 "$out/$zip.sha256")\`. To the Workshop: \`tools/release.sh $MOD $GITHUB_REF_NAME test\`, then \`live\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "$out/$zip" "$out/$zip.sha256" "$out/changenote.txt"
